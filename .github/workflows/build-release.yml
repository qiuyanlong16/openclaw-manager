name: Build & Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "选择构建平台"
        required: true
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - all
      tag:
        description: "发布标签 (如 v0.1.0, 留空则使用 package.json 版本)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    if: ${{ inputs.platform == 'ubuntu-latest' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Build Tauri (DEB)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-manager-linux
          path: src-tauri/target/release/bundle/deb/*.deb

  build-windows:
    if: ${{ inputs.platform == 'windows-latest' || inputs.platform == 'all' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Build Tauri (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-manager-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: [build-linux, build-windows]
    if: ${{ always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -e "console.log(require('./package.json').version)")
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            openclaw-manager-linux/**/*.deb
            openclaw-manager-windows/**/*.exe
